# ──────────────────────────────────────────────────────────────────────────────
# HorizontalPodAutoscaler
# Scales between 2–10 pods when avg CPU exceeds 50 % of request (250m)
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-flask
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hpa-flask
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # ── CPU ──────────────────────────────────────────────────────────────────
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50    # % of requests.cpu (250m)
    # ── Memory ───────────────────────────────────────────────────────────────
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70    # % of requests.memory (256Mi)
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30     # react quickly to traffic spikes
      policies:
        - type: Pods
          value: 2                       # add up to 2 pods per interval
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120    # be conservative when scaling in
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
